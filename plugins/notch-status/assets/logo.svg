<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>notch-status</title>
  <rect width="512" height="512" rx="112" fill="#1F1E1D"/>
  <!-- L'écran et son encoche -->
  <rect x="56" y="104" width="400" height="304" rx="44" fill="#2E2D2A"/>
  <path d="M168 104 h176 v30 a30 30 0 0 1 -30 30 h-116 a30 30 0 0 1 -30 -30 z" fill="#0E0E0D"/>
  <!-- Les sessions dans l'encoche : en cours, en attente, terminée -->
  <circle cx="222" cy="132" r="10" fill="#D97757"/>
  <circle cx="256" cy="132" r="10" fill="#E8A33D"/>
  <circle cx="290" cy="132" r="10" fill="#5BB98B"/>
  <!-- L'aiguillage : deux voies qui se séparent -->
  <path d="M112 292 H236" stroke="#E9E4DA" stroke-width="16" stroke-linecap="round" fill="none"/>
  <path d="M236 292 H400" stroke="#E9E4DA" stroke-opacity="0.45" stroke-width="16" stroke-linecap="round" fill="none"/>
  <path d="M236 292 C 286 292, 300 228, 352 228 H400" stroke="#E9E4DA" stroke-width="16" stroke-linecap="round" fill="none"/>
  <!-- La pilule de la semaine -->
  <rect x="112" y="344" width="288" height="20" rx="10" fill="#8A8A8A" fill-opacity="0.3"/>
  <rect x="112" y="344" width="196" height="20" rx="10" fill="#D97757"/>
</svg>
